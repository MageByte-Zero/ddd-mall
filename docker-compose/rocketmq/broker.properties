brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true

# 容器内必须显式指定存储路径，否则 ScheduleMessageService NPE
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
storePathConsumeQueue=/home/rocketmq/store/consumequeue

# 注册到 nameserver 的 broker 地址必须对所有生产者/消费者可达。
# 业务应用（mall-* 四个 jar）运行在宿主机上、经发布端口 10911 连 broker，
# 因此注册地址必须是宿主机可达地址；docker 网络别名 rocketmq-broker 只在容器网络内可解析，
# 宿主机上没有这条 DNS 记录（第 8 讲领域事件首次从宿主机发消息时实证）。
# 副作用：容器内的 rocketmq-console 经 namesrv 拿到 127.0.0.1 后直连 broker 会失败，
# 集群/主题列表（走 namesrv）不受影响；消息详情等 broker 直连页面以应用日志为准。
brokerIP1=127.0.0.1
namesrvAddr=rocketmq-namesrv:9876
listenPort=10911
