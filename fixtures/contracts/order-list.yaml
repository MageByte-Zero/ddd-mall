openapi: 3.0.3
info:
  title: 已付款订单列表与预占状态批查
  version: 1.0.0
  description: 可信内部查询。订单只读事务结束后单独观察库存，两个结果没有跨上下文同一时点保证。
paths:
  /internal/order-list:
    servers:
      - url: http://mall-order:8084
    get:
      operationId: listAcceptedOrders
      parameters:
        - {in: query, name: userId, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {in: query, name: beforeId, schema: {type: integer, format: int64, minimum: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
      responses:
        '200':
          description: 已接受付款的订单页，库存失败时只影响库存栏
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [200]}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/OrderList'}
        '400': {description: 查询参数非法}
  /internal/inventory-reservations/batch-query:
    servers:
      - url: http://mall-inventory:8082
    post:
      operationId: observeReservations
      summary: 只读核对原预占状态，缺失的引用不返回记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationNos]
              properties:
                reservationNos:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: 这一轮状态查询及观察时间
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [200]}
                  message: {type: string}
                  data:
                    type: object
                    required: [observedAt, reservations]
                    properties:
                      observedAt: {type: string, format: date-time}
                      reservations:
                        type: array
                        items: {$ref: '#/components/schemas/ReservationStatus'}
        '400': {description: 批查请求非法}
components:
  schemas:
    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: {$ref: '#/components/schemas/OrderRow'}
        nextBeforeId: {type: integer, format: int64, nullable: true}
        inventoryObservedAt: {type: string, format: date-time, nullable: true}
    OrderRow:
      type: object
      properties:
        orderNo: {type: string}
        createdAt: {type: string, description: 订单库本地时间}
        fulfillmentStatus: {type: string, enum: [PAID, SHIPPED, RECEIVED]}
        paidAmount: {type: number, description: 订单已接受的人民币实付}
        refund: {$ref: '#/components/schemas/RefundSummary'}
        lines:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/OrderLine'}
        hasMoreLines: {type: boolean}
    OrderLine:
      type: object
      properties:
        lineId: {type: string}
        skuId: {type: integer, format: int64}
        productName: {type: string, description: 成交时名称}
        quantity: {type: integer}
        unitPrice: {type: number, description: 成交时人民币单价}
        reservationNo: {type: string, nullable: true}
        shipmentCheck:
          type: string
          enum: [NOT_APPLICABLE, NOT_VERIFIED, NOT_FOUND, UNAVAILABLE, MISMATCH, RESERVED, CONFIRMED, RELEASED]
    RefundSummary:
      type: object
      properties:
        mode: {type: string, enum: [NONE, FULL, PARTIAL]}
        fullStatus: {type: string, nullable: true}
        fullOutcome: {type: string, nullable: true}
        fullRequestedAmount: {type: number, nullable: true}
        inFlightAmount: {type: number, nullable: true, description: 仅部分退款使用}
        refundedAmount: {type: number}
    ReservationStatus:
      type: object
      required: [reservationNo, skuCode, quantity, state]
      properties:
        reservationNo: {type: string}
        skuCode: {type: string}
        quantity: {type: integer}
        state: {type: string, enum: [RESERVED, CONFIRMED, RELEASED]}
