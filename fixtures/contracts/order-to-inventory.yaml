openapi: 3.0.3
info:
  title: 订单 → 库存集成契约
  version: 1.2.0
  description: |
    L13 库存动作幂等契约。单SKU订单 reservationNo=orderNo:skuCode，
    requestKey=RESERVE:reservationNo 或 RELEASE:reservationNo。
    requestKey在库存BC全局唯一；相同键同内容回原结果，异参409；
    同预占单同动作换key409，不创建第二份动作；只支持整笔释放/出库。
    结果是分支结果，Seata AT最终结果由全局事务决定，不等于订单请求入口幂等。
    L12旧余额无业务归属，迁移前必须核对，不能自动生成预占单。
servers:
  - url: http://mall-inventory:8082
paths:
  /api/inventories/reservations:
    post:
      operationId: reserveInventory
      summary: 按业务身份预占
      requestBody:
        $ref: '#/components/requestBodies/Operation'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessFailure'
  /api/inventories/releases:
    post:
      operationId: releaseInventory
      summary: 整笔释放既有预占，旧二字段输入400
      requestBody:
        $ref: '#/components/requestBodies/Operation'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessFailure'
  /api/inventories/confirmations:
    post:
      operationId: confirmInventory
      summary: 整笔确认出库，与释放互斥
      requestBody:
        $ref: '#/components/requestBodies/Operation'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessFailure'
  /api/inventories/deductions:
    post:
      deprecated: true
      operationId: deprecatedDeductInventory
      summary: 保留路径但拒绝写入，必须迁移至reservations
      responses:
        '422':
          $ref: '#/components/responses/BusinessFailure'
components:
  requestBodies:
    Operation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
  responses:
    Success:
      description: 首次结果快照或同一请求原结果；不是当前库存查询
      content:
        application/json:
          schema:
            type: object
            properties:
              code: {type: integer, example: 200}
              message: {type: string}
              data:
                allOf:
                  - $ref: '#/components/schemas/Operation'
                  - type: object
                    properties:
                      action: {type: string, enum: [RESERVE, RELEASE, CONFIRM]}
                      totalStock: {type: integer}
                      availableStock: {type: integer}
                      reservedStock: {type: integer}
    Invalid:
      description: 格式错误、缺身份或数量非正，400
    Conflict:
      description: 身份冲突不可盲重试；库存版本并发冲突可重试整个用例
    BusinessFailure:
      description: 库存不足、缺预占单或终态不允许，422
  schemas:
    Operation:
      type: object
      required: [requestKey, reservationNo, skuCode, quantity]
      properties:
        requestKey: {type: string, minLength: 1, maxLength: 128}
        reservationNo: {type: string, minLength: 1, maxLength: 128}
        skuCode: {type: string, minLength: 1, maxLength: 64}
        quantity: {type: integer, minimum: 1}
