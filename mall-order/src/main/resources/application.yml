server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: mall-order
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/mall_order?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ddd_root_2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        # 骨架阶段只用本地 application.yml；第 20 讲引入 Nacos 配置中心时反转此开关
        enabled: false
        server-addr: localhost:8848
        file-extension: yaml
        import-check:
          enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

seata:
  enabled: true
  application-id: mall-order
  tx-service-group: ddd-mall-tx-group
  service:
    # 事务分组 → TC 集群名映射
    vgroup-mapping:
      ddd-mall-tx-group: default
    # 教学网络形态：TC 在 docker 容器（注册的 bridge IP 对宿主机不可达），
    # 应用在宿主机经发布端口连 TC，用静态地址列表；容器化部署改 registry.type=nacos 即可
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

rocketmq:
  name-server: localhost:9876
  producer:
    group: mall-order-producer
    sendMessageTimeout: 10000

ddd:
  outbox:
    # Outbox 中继器轮询间隔：投递延迟（最坏约等于一个间隔）与数据库轮询压力的取舍
    relay-interval-ms: 2000
    # 应用启动后首次轮询的延迟，给 broker 注册/消费者装配留缓冲
    relay-initial-delay-ms: 5000
