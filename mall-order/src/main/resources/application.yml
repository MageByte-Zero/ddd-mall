server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: mall-order
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/mall_order?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ddd_root_2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        # 骨架阶段只用本地 application.yml；第 20 讲引入 Nacos 配置中心时反转此开关
        enabled: false
        server-addr: localhost:8848
        file-extension: yaml
        import-check:
          enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

seata:
  # 暂不启用 Seata；第 10 讲引入 AT 模式时改为 true
  enabled: false
  application-id: mall-order
  tx-service-group: ddd-mall-tx-group
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: ""
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      group: SEATA_GROUP

rocketmq:
  name-server: localhost:9876
  producer:
    group: mall-order-producer
    sendMessageTimeout: 10000

ddd:
  outbox:
    # Outbox 中继器轮询间隔：投递延迟（最坏约等于一个间隔）与数据库轮询压力的取舍
    relay-interval-ms: 2000
    # 应用启动后首次轮询的延迟，给 broker 注册/消费者装配留缓冲
    relay-initial-delay-ms: 5000
