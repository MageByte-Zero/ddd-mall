server:
  port: 8081

spring:
  application:
    name: mall-product
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/mall_product?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ddd_root_2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        # 骨架阶段只用本地 application.yml；第 20 讲引入 Nacos 配置中心时反转此开关
        enabled: false
        server-addr: localhost:8848
        file-extension: yaml
        import-check:
          enabled: false
